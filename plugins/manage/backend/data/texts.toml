# Every text of cc-manage that a person or a builder reads. `{name}` is filled in by the plugin;
# each text must keep exactly the placeholders it is shipped with (a live copy that drops one is
# ignored). Edit the live copy (<home>/live/plugins/manage/backend/data/texts.toml): it is read on
# every use.

# ---- steers: fixed sentences to the builder, the fact filled in, ending with the next step ------
steer_w1 = "The command `{command}` has failed {count} times in the same way. Do not run it again as it is. Read its error, change what it complains about, then run it once. Then continue with: \"{next}\"."
steer_w2 = "You made the same call {count} times and got the same result each time. It will not change by asking again. Use what you already have, or look somewhere else. Then continue with: \"{next}\"."
steer_w3 = "You made {calls} calls without changing a file. You know enough to start. Make the first edit now. Then continue with: \"{next}\"."
steer_w4 = "You changed `{file}`. This task does not change that file. Undo that change. Then continue with: \"{next}\"."
steer_not_delivered = "The steer could not be delivered: {why}"
approval_refused = "This job may not use `{tool}` for that ({classes}): the plan does not list it. Do the task with what is in the workspace, without it. Then continue with: \"{next}\"."

