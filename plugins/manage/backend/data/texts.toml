# Every text of cc-manage that a person or a builder reads. `{name}` is filled in by the plugin;
# each text must keep exactly the placeholders it is shipped with (a live copy that drops one is
# ignored). Edit the live copy (<home>/live/plugins/manage/backend/data/texts.toml): it is read on
# every use.

# ---- steers: fixed sentences to the builder, the fact filled in, ending with the next step ------
steer_w1 = "The command `{command}` has failed {count} times in the same way. Do not run it again as it is. Read its error, change what it complains about, then run it once. Then continue with: \"{next}\"."
steer_w2 = "You made the same call {count} times and got the same result each time. It will not change by asking again. Use what you already have, or look somewhere else. Then continue with: \"{next}\"."
steer_w3 = "You made {calls} calls without changing a file, and nothing changed for {minutes} minutes. You know enough to start. Make the first edit now. Then continue with: \"{next}\"."
steer_w4 = "You changed `{file}`. This task does not change that file. Undo that change. Then continue with: \"{next}\"."
steer_not_delivered = "The steer could not be delivered: {why}"
approval_refused = "This job may not use `{tool}` for that ({classes}): the plan does not list it. Do the task with what is in the workspace, without it. Then continue with: \"{next}\"."

# ---- the facts that fire a rule (shown in the Watch pane and given to a restarted task) ---------
fact_w1 = "The command `{command}` failed {count} times in the same way."
fact_w2 = "The same call gave the same result {count} times."
fact_w3 = "{calls} calls without an edit; idle for {minutes} minutes."
fact_w4 = "Changed outside the task's scope: {file}."
fact_w5 = "A protected file was changed: {file}."
fact_w6 = "A charter check failed ({rule}) in {file}: {text}"
fact_w7 = "The budget is passed: {minutes} of {limit_minutes} minutes, {tokens} of {limit_tokens} tokens, {lines} of {limit_lines} lines."
fact_w8 = "No beat from the runner for a minute. The job is marked lost; it goes on from its last checkpoint when the runner is back."
fact_w8_back = "The runner is back."
fact_drift = "The diff of \"{task}\" does not do what the task says: {reason}"
fact_approval = "The builder asked to use `{tool}` ({classes}): {question}"
fact_context = "The builder's context was full."
fact_error = "The run stopped with an error: {error}"
fact_rework = "A gate failed: {finding}"
fact_conflict = "Landing found conflicts in: {files}."
fact_resumed = "The package may go on."
fact_rerun = "You said to try again."
fact_sent_back = "You sent it back: {note}"
restart_note = "An earlier try at this task was stopped. {fact} Do it differently this time."
note_context = "An earlier try at this task ran out of context. Work in smaller steps and read only what the task needs."
note_resolve = "The main branch moved and these files are in conflict: {files}. Resolve the conflicts so that both changes hold, and run the task's checks."
drift_no_diff = "The checkpoint's diff could not be read ({why}), so the task's diff was not checked."
drift_empty = "The checkpoint has no diff to check."
drift_not_asked = "The question \"does this diff do what the task says?\" could not be asked ({why}). The checkpoint is not checked."
drift_no_line = "The answer was yes, but the line it named ({file}:{line}) is not in the diff, so it counts as no."
drift_no_reason = "The answer was no, without a reason."
replan_accepted = "The builder's new plan for the rest ({count} tasks) was accepted."
replan_refused = "The builder's new plan was refused: not every new task may be kept. The job goes on with the old plan."
replan_refused_tier = "The builder's new plan was refused: it would make this a {tier} change. The job stops and the package is held again."

# ---- tier reasons, one plain sentence each -------------------------------------------------------
reason_model = "The assessment proposed {tier}: {because}"
reason_no_plan = "There is no plan yet, so no paths raise the tier."
reason_major_path = "It changes {path}, which is on this repository's list of major paths."
reason_minor_path = "It changes {path}, which is on this repository's list of minor paths."
reason_standard = "It changes {path}, a file of the mesh standard."
reason_many_points = "The plan has {count} points; more than {limit} make a change major."
reason_many_lines = "The plan allows {count} changed lines; more than {limit} make a change major."
reason_more = "And {count} more paths of the same kind."
reason_safe = "No path of the plan is on the repository's major or minor lists, and the plan is small."

