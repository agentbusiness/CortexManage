# CortexManage plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# data, UI packages and README together, separable into its own repository (only cc-protocol and
# @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it into a portable
# .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "manage"
name = "Manage"
version = "0.1.27"
description = "The lifecycle of a change: requests are assessed, planned and validated, held in packages, built by a runner under the watch, proven by the gates, landed and handed to the release train. With the sidebar, the card, the watch, the evidence, the inbox and the Hold switch."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The lifecycle engine: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "manage"
contract = "manage@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-manage"
provides = [
  "manage.repo.list", "manage.repo.get", "manage.repo.create", "manage.repo.edit",
  "manage.request.create", "manage.request.get", "manage.request.list", "manage.request.edit", "manage.request.say",
  "manage.package.get", "manage.package.list", "manage.package.edit",
  "manage.decide", "manage.inbox.list", "manage.hold.get", "manage.hold.edit", "manage.evidence.read",
  "manage.discover.read", "manage.discover.search", "manage.discover.tree",
  "manage.runner.release", "manage.runner.get",
  "manage.board.items",
  "manage.shares",
  "manage.reports.send", "manage.reports.read", "manage.reports.request",
  "manage.timeline.read", "manage.request.reopen", "manage.request.story",
  "manage.delivery.learn", "manage.delivery.edit", "manage.secrets.get", "manage.secrets.set", "manage.release.waits",
  "manage.rules.get", "manage.rules.edit",
]
publishes = ["manage.changed", "manage.watch"]
subscribes = ["plugin.state", "plugin.swapped", "train.released"]
uses = [
  "memory.graph.put", "memory.graph.retire", "memory.graph.query", "memory.graph.machine",
  "memory.stream.append", "memory.stream.read", "memory.stream.topics",
  "frame.project.open", "frame.session.create", "frame.session.update", "frame.journal.append", "frame.journal.patch",
  "mesh.link", "mesh.peers",
  "chatflow-manage.assess", "chatflow-manage.match", "chatflow-manage.plan", "chatflow-manage.validate",
  "chatflow-manage.drift", "chatflow-manage.converge", "chatflow-manage.digest", "chatflow-manage.why",
  "chatflow-manage.delivery", "chatflow-manage.commit", "chatflow-manage.rules",
  "vcs.github.credential", "vcs.github.file", "vcs.github.tree", "vcs.github.rules", "vcs.github.workflows",
  "vcs.github.pulls", "vcs.github.runs", "vcs.github.head", "vcs.github.tag",
  "charter.get", "charter.rules_for", "charter.check",
  "standard.touches", "standard.paths",
  "train.landed", "train.get", "train.bump", "train.run",
  "notify.send",
]

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

# The sidebar: repositories, their packages and sessions, then the mesh standard.
[[ui.package]]
dir = "ui/sidebar"
id = "manage.sidebar"
slot = "workbench.sidebar@1"

# The centre: a request's session, the inbox, or one of the pages.
[[ui.package]]
dir = "ui/centre"
id = "manage.centre"
slot = "workbench.chat@1"

# Right pane: Details of the open request.
[[ui.package]]
dir = "ui/card"
id = "manage.card"
slot = "pane.card@1"

# The band: "Waits on you" with the count line.
[[ui.package]]
dir = "ui/inbox"
id = "manage.inbox"
slot = "workbench.band@1"

# Settings > Rules: the rules every repository's commits and releases keep.
[[ui.package]]
dir = "ui/settings"
id = "manage.settings"
slot = "settings.manage@1"

# The band: the Hold switch.
[[ui.package]]
dir = "ui/hold"
id = "manage.hold"
slot = "workbench.band@1"


# The plugin's texts (steer sentences, inbox words, stage lines): packed at the same path; the app
# reads and edits them live in the live folder (<home>/live/plugins/manage/backend/data).
[data]
dirs = ["backend/data"]
