# The checks kept by code. Each one is a small function over a change's file list and the lines its
# diff adds; this file holds what each check looks for and the sentence a person reads when it
# finds something. `{name}` is filled in by the code; keep every placeholder.
#
# A check is listed as run only when it could really decide. A check with `not_run` never runs:
# the reason is written there.

[[check]]
id = "no-record-files"
title = "No record files"
keeps = "The graph is the only record. A plugin does not write its records to a file."
finding = "{file} is a new `{ending}` file under a plugin's `{folder}` folder. Records belong in the graph."

[[check]]
id = "no-tests"
title = "No tests"
keeps = "No test code and no test folders. A plugin's probe exercises it for real."
finding = "{file} adds a test: {what}."

[[check]]
id = "no-native-controls"
title = "No native controls"
keeps = "The theme's controls only: no native select, checkbox or radio."
finding = "{file} adds {what}. Use the theme's control instead."

[[check]]
id = "theme-untouched"
title = "Theme untouched"
keeps = "The theme changes only in a standard change."
finding = "{file} is part of the theme, and this is not a standard change."

[[check]]
id = "no-secrets"
title = "No secrets"
keeps = "Nothing that looks like a key or a token goes into a change."
finding = "{file} adds what looks like {what}. Take it out and keep it outside the repository."

[[check]]
id = "agents-file-untouched"
title = "Printed files untouched"
keeps = "AGENTS.md and standard.lock are printed by CortexManage. A builder does not edit them."
finding = "{file} is printed by CortexManage, and this is not a charter or standard change."

[[check]]
id = "contract-calls-only"
title = "Contract calls only"
keeps = "A plugin names only the methods its plugin.toml lists under `uses`."
finding = "{file} calls `{what}`, which the plugin's plugin.toml does not list under `uses`."
not_run = "A diff does not hold the plugin's plugin.toml, and a method name in a line cannot be told from any other text by code alone. This check waits for a caller that sends the manifest."

# ----- no-record-files -----
# A NEW file (the diff says it did not exist) whose name ends in one of `endings`, somewhere under
# `plugins/<id>/` inside a folder named in `folders`. The names below are configuration, not records.
[records]
endings = [".json", ".sqlite", ".db"]
folders = ["backend", "data"]
allowed_names = ["package.json", "package-lock.json", "manifest.json", "schema.json"]
allowed_starts = ["tsconfig"]
allowed_ends = [".schema.json", ".lock", ".lock.json", "-lock.json"]

# ----- no-tests -----
# An added line of a `.rs` file that starts (after spaces) with one of `line_starts`; a changed file
# inside a folder named in `folders`; a file whose name has one of `name_parts` between two dots
# (`thing.test.ts`).
[tests]
line_endings = [".rs"]
line_starts = ["#[cfg(test)]", "#![cfg(test)]", "#[test]", "#[tokio::test"]
folders = ["tests"]
name_parts = ["test", "spec"]

# ----- no-native-controls -----
# An added line of a file ending in one of `endings` that holds one of the marks. A `tag` mark is
# the start of an element (`<select`, then a space, `>`, `/` or the line's end); a `text` mark is
# that exact text.
[controls]
endings = [".tsx", ".jsx", ".html"]

[[controls.mark]]
tag = "select"
what = "a native select"

[[controls.mark]]
text = 'type="checkbox"'
what = "a native checkbox"

[[controls.mark]]
text = "type='checkbox'"
what = "a native checkbox"

[[controls.mark]]
text = 'type="radio"'
what = "a native radio button"

[[controls.mark]]
text = "type='radio'"
what = "a native radio button"

# ----- theme-untouched -----
[theme]
folder = "plugins/theme-cortex/"

# ----- agents-file-untouched -----
# A changed file with one of these names, in any folder.
[printed]
names = ["AGENTS.md", "standard.lock"]

# ----- no-secrets -----
# Three shapes, all looked for in added lines only. The finding never repeats the value.
#
# 1. A private key header: a line holding `header_start` and, after it, `header_end`.
# 2. A token with a known start: `starts`, not right after a letter or digit, followed by at least
#    `tail` more characters of letters, digits, `_` or `-`.
# 3. An assignment of a long literal to a secret-sounding name: a name holding one of `names`
#    (letters compared without case), then `=` or `:`, then a quoted value of at least `value_chars`
#    characters that are all letters, digits or `+ / = _ - .`, with at least one letter and one
#    digit. A sentence, a path with spaces or a placeholder without digits is not that shape.
[secrets]
header_start = "-----BEGIN "
header_end = "PRIVATE KEY-----"
names = ["secret", "token", "password", "passwd", "api_key", "apikey", "api-key", "private_key", "access_key", "auth_key"]
value_chars = 20

[[secrets.token]]
starts = "sk-ant-"
tail = 20
what = "an Anthropic API key"

[[secrets.token]]
starts = "sk-proj-"
tail = 20
what = "an OpenAI API key"

[[secrets.token]]
starts = "ghp_"
tail = 30
what = "a GitHub token"

[[secrets.token]]
starts = "gho_"
tail = 30
what = "a GitHub token"

[[secrets.token]]
starts = "ghs_"
tail = 30
what = "a GitHub token"

[[secrets.token]]
